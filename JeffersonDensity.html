<!DOCTYPE html>
<html lang="en">
<head>
    <!-- #1 Page title -->
    <title>Jefferson County, KY Population Density</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <style>
        html, body { height: 100%; margin: 0; }
        #map { width: 100%; height: 100%; min-height: 600px; }
        .map-title {
            position: absolute; z-index: 1000; top: 12px; left: 50px;
            background: white; padding: 8px 12px; border-radius: 4px;
            font:  bold 16px Arial, sans-serif; box-shadow: 0 1px 5px #888;
        }
        .legend {
            line-height: 18px; color: #333; background: white;
            padding: 8px 10px; border-radius: 4px; box-shadow: 0 1px 5px #888;
            font: 12px Arial, sans-serif;
        }
        .legend i { width: 14px; height: 14px; float: left; margin-right: 8px; opacity: .8; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- #2 Load the GeoJSON data variable from the companion file. -->
    <script src="jefftracts.js" type="text/javascript"></script>

    <!-- Leaflet JavaScript library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // #3 Center the map on Jefferson County, Kentucky.
        var map = L.map('map').setView([38.19, -85.68], 10);

        // #4 Esri World Street Map basemap.
        // This avoids sending requests to the OpenStreetMap volunteer tile server.
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> and its contributors'
        }).addTo(map);

        // #5 Convert population density values into choropleth colors.
        function getColor(v) {
            return v > 7184.33 ? '#800026' :
                   v > 4935.72 ? '#BD0026' :
                   v > 3311.67 ? '#E31A1C' :
                   v > 1721.32 ? '#FC4E2A' :
                   v > 114.10  ? '#FD8D3C' :
                                 '#FEB24C';
        }

        // #6 Style each census tract polygon.
        function style(feature) {
            return {
                fillColor: getColor(Number(feature.properties.PDENSITY)),
                weight: 1,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }

        // Check that the GeoJSON file was loaded before trying to map it.
        if (typeof tractData === 'undefined' || !tractData.features) {
            throw new Error('Could not load tractData. Make sure jefftracts.js is in the same folder as this HTML file.');
        }

        // Add the GeoJSON census tracts, apply the style, and bind pop-ups.
        var layer = L.geoJSON(tractData, {
            // #7 Apply the style function.
            style: style,

            // #8 Show the tract ID and population density when a polygon is clicked.
            onEachFeature: function (feature, layer) {
                var tractId = feature.properties.GEO_ID ?? 'Not available';
                var density = feature.properties.PDENSITY;
                layer.bindPopup(
                    '<h3>Tract ID: ' + tractId + '</h3>' +
                    '<p>Population Density (per sq mi): ' + Number(density).toLocaleString(undefined, {maximumFractionDigits: 2}) + '</p>'
                );
            }
        }).addTo(map);

        // Zoom the map to the census tract layer's extent.
        map.fitBounds(layer.getBounds());

        // Add a legend showing the population-density classes.
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'legend');
            var grades = [0, 114.10, 1721.32, 3311.67, 4935.72, 7184.33];
            var labels = [];
            for (var i = 0; i < grades.length; i++) {
                var from = grades[i];
                var to = grades[i + 1];
                labels.push('<i style="background:' + getColor(from + 0.01) + '"></i> ' +
                    from.toLocaleString() + (to ? '&ndash;' + to.toLocaleString() : '+'));
            }
            div.innerHTML = '<strong>People per sq. mi.</strong><br>' + labels.join('<br>');
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
